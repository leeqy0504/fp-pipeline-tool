[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pipeline-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[project.optional-dependencies]
hunyuan = ["tencentcloud-sdk-python>=3.0"]
